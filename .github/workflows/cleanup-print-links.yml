name: Limpar links de impressão expirados
on:
  schedule:
    # Diariamente às 06:00 UTC (03:00 em Fortaleza).
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanup-print-links
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/cleanup-print-links.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
